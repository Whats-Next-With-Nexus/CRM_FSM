<style>
  .ov {
    --ov-card: #fff; --ov-soft: var(--color-base-50); --ov-line: var(--color-base-200);
    --ov-text: var(--color-base-900); --ov-muted: var(--color-base-500); --ov-accent: var(--color-primary-600);
    --ov-warn-bg: #fef3c7; --ov-warn-fg: #92400e; --ov-bad-bg: #fee2e2; --ov-bad-fg: #991b1b;
    --ov-ok-bg: #dcfce7; --ov-ok-fg: #166534; --ov-info-bg: #dbeafe; --ov-info-fg: #1e40af;
    display: grid; gap: 20px; color: var(--ov-text); font-size: 14px;
  }
  .dark .ov {
    --ov-card: var(--color-base-900); --ov-soft: var(--color-base-950); --ov-line: var(--color-base-800);
    --ov-text: var(--color-base-100); --ov-muted: var(--color-base-400); --ov-accent: var(--color-primary-400);
    --ov-warn-bg: rgba(245, 158, 11, .16); --ov-warn-fg: #fbbf24; --ov-bad-bg: rgba(239, 68, 68, .16); --ov-bad-fg: #f87171;
    --ov-ok-bg: rgba(34, 197, 94, .16); --ov-ok-fg: #4ade80; --ov-info-bg: rgba(59, 130, 246, .18); --ov-info-fg: #93c5fd;
  }
  .ov h1 { margin: 0; font-size: 24px; font-weight: 700; }
  .ov h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .ov h3 { margin: 18px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ov-muted); }
  .ov a { color: var(--ov-accent); text-decoration: none; }
  .ov a:hover { text-decoration: underline; }
  .ov p { margin: 0; }
  .ov .sub { color: var(--ov-muted); margin-top: 4px; }
  .ov .muted { color: var(--ov-muted); }
  .ov .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .ov .btn, .ov input[type=submit] {
    display: inline-block; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ov-line); background: var(--ov-card);
    color: var(--ov-text); font-weight: 500; cursor: pointer; text-decoration: none; font-size: 14px;
  }
  .ov .btn:hover { border-color: var(--ov-accent); text-decoration: none; }
  .ov .btn.primary, .ov input[type=submit] { background: var(--color-primary-600); border-color: var(--color-primary-600); color: #fff; }
  .ov .btn.primary:hover, .ov input[type=submit]:hover { background: var(--color-primary-700); }
  .ov .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--ov-soft); border: 1px solid var(--ov-line); color: var(--ov-text); white-space: nowrap; }
  .ov .badge.warn { background: var(--ov-warn-bg); color: var(--ov-warn-fg); border-color: transparent; }
  .ov .badge.bad { background: var(--ov-bad-bg); color: var(--ov-bad-fg); border-color: transparent; }
  .ov .badge.ok { background: var(--ov-ok-bg); color: var(--ov-ok-fg); border-color: transparent; }
  .ov .badge.info { background: var(--ov-info-bg); color: var(--ov-info-fg); border-color: transparent; }
  .ov .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .ov .stat { border: 1px solid var(--ov-line); border-radius: 10px; padding: 12px 16px; background: var(--ov-card); }
  .ov .stat small { display: block; color: var(--ov-muted); font-size: 12px; }
  .ov .stat b { display: block; font-size: 26px; line-height: 1.25; font-weight: 700; margin: 2px 0; }
  .ov .stat span { color: var(--ov-muted); font-size: 12px; }
  .ov .panel { border: 1px solid var(--ov-line); border-radius: 10px; padding: 16px 18px; background: var(--ov-card); }
  .ov .panel.attention { border-left: 4px solid #f59e0b; }
  .ov .panel.attention ul { margin: 8px 0 0; padding-left: 18px; list-style: disc; }
  .ov .site-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .ov .site-head .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ov table { width: 100%; border-collapse: collapse; }
  .ov th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ov-muted); padding: 8px 10px; border-bottom: 1px solid var(--ov-line); }
  .ov td { padding: 9px 10px; border-bottom: 1px solid var(--ov-line); vertical-align: top; }
  .ov tbody tr:last-child td { border-bottom: 0; }
  .ov td.num, .ov th.num { text-align: right; white-space: nowrap; }
  .ov .note { white-space: pre-line; }
  .ov .intro { color: var(--ov-muted); max-width: 70ch; }
  .ov form .group { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 18px; margin-top: 12px; }
  .ov form .field label { display: block; font-weight: 500; margin-bottom: 4px; }
  .ov form .field .help { color: var(--ov-muted); font-size: 12px; margin-top: 3px; }
  .ov form .field .errorlist { color: var(--ov-bad-fg); list-style: none; margin: 0 0 4px; padding: 0; font-size: 13px; }
  .ov form .field.wide { grid-column: 1 / -1; }
  .ov form input[type=text], .ov form input[type=email], .ov form input[type=date], .ov form select, .ov form textarea {
    width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--ov-line); background: var(--ov-soft); color: var(--ov-text);
  }
  .ov form [id=id_system_types] { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .ov form [id=id_system_types] label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; }
  .ov .formerror { background: var(--ov-bad-bg); color: var(--ov-bad-fg); border-radius: 8px; padding: 10px 14px; }
  .ov .actions-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
</style>
