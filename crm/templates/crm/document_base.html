<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block doc_title %}Document{% endblock %}</title>
  <style>
    :root { --ink: #1c2530; --muted: #5b6673; --line: #d5dbe2; --accent: #1f4e79; }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); margin: 0; background: #eef1f4; }
    .page { max-width: 820px; margin: 24px auto; background: #fff; padding: 48px 56px; position: relative; }
    header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--accent); padding-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .doc-title { text-align: right; }
    .doc-title strong { font-size: 20px; display: block; }
    .muted { color: var(--muted); }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0; }
    .meta h2, h3.label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--line); padding: 8px 6px; }
    td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align: right; white-space: nowrap; }
    .totals { margin-left: auto; width: 340px; }
    .totals td { border: 0; padding: 4px 6px; }
    .totals .grand td { font-weight: 700; font-size: 17px; border-top: 2px solid var(--ink); padding-top: 8px; }
    .terms { margin-top: 28px; font-size: 13px; color: var(--muted); }
    .sign { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; margin-top: 48px; }
    .sign div { border-top: 1px solid var(--ink); padding-top: 4px; font-size: 12px; color: var(--muted); }
    .watermark { position: absolute; top: 40%; left: 10%; font-size: 100px; font-weight: 800; color: rgba(180, 30, 30, .12); transform: rotate(-24deg); pointer-events: none; }
    .banner { background: #fdf3d6; border: 1px solid #e6cf85; padding: 8px 12px; margin: 0 0 16px; font-size: 13px; }
    .toolbar { max-width: 820px; margin: 16px auto 0; text-align: right; }
    button { font: inherit; padding: 8px 16px; border: 0; background: var(--accent); color: #fff; border-radius: 4px; cursor: pointer; }
    @media print {
      body { background: #fff; }
      .page { margin: 0; padding: 0; max-width: none; }
      .toolbar { display: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Print or save as PDF</button></div>
  <div class="page">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
